{# Grouped SVG bar chart: revenue vs expenses per month.
   Expects `series`: [{label, revenue, expenses}] and `chart_max` (numeric). #}
<div class="bars" role="img" aria-label="Monthly revenue versus expenses">
  <svg viewBox="0 0 620 210" style="width:100%;height:auto">
    {% for s in series %}
      {% widthratio s.revenue chart_max 140 as rh %}
      {% widthratio s.expenses chart_max 140 as eh %}
      {% widthratio rh 1 -1 as rh_neg %}
      {% widthratio eh 1 -1 as eh_neg %}
      {% widthratio forloop.counter0 1 96 as bx %}
      <g>
        <rect x="{{ bx|add:20 }}" y="{{ 170|add:rh_neg }}" width="28" height="{{ rh }}" rx="4" fill="#22a06b">
          <title>{{ s.label }} revenue {{ s.revenue|floatformat:0 }}</title></rect>
        <rect x="{{ bx|add:52 }}" y="{{ 170|add:eh_neg }}" width="28" height="{{ eh }}" rx="4" fill="#e6a23c">
          <title>{{ s.label }} expenses {{ s.expenses|floatformat:0 }}</title></rect>
        <text x="{{ bx|add:50 }}" y="190" font-size="12" fill="#888" text-anchor="middle">{{ s.label }}</text>
      </g>
    {% endfor %}
    <line x1="10" y1="170" x2="610" y2="170" stroke="#ccc" stroke-width="1"/>
  </svg>
  <div style="display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:4px">
    <span><span style="display:inline-block;width:10px;height:10px;background:#22a06b;border-radius:2px"></span> Revenue</span>
    <span><span style="display:inline-block;width:10px;height:10px;background:#e6a23c;border-radius:2px"></span> Expenses</span>
  </div>
</div>
