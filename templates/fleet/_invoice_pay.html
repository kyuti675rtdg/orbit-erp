{% load icons %}
<div class="card">
  <h3><span class="h-ico">{% icon 'card' 20 %}</span> Record Payment</h3>
  <div class="sub">Applies to invoice {{ obj.invoice_no }} ({{ obj.total }} ETB)</div>
  <form method="post" action="{% url 'fleet_invoice_pay' company_slug=company.slug pk=obj.pk %}">
    {% csrf_token %}
    <div class="form-grid">
      <div><label class="lbl">Amount (ETB)</label><input class="input" type="number" step="0.01" name="amount" required></div>
      <div><label class="lbl">Method</label><select class="input" name="method"><option value="bank">Bank Transfer</option><option value="cash">Cash</option><option value="mobile">Mobile Money</option><option value="cheque">Cheque</option></select></div>
    </div>
    <label class="lbl">Reference</label><input class="input" type="text" name="reference" placeholder="Receipt / ref no">
    <div style="margin-top:14px"><button class="btn btn-primary btn-sm" type="submit">Record Payment</button></div>
  </form>
</div>
