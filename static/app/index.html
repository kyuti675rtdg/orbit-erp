<!DOCTYPE html>
<html>
<head>
  <base href="/static/app/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Orbit ERP — native-like mobile ERP. Companies, chat, approvals and alerts.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ff8c00">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Orbit ERP">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
  <link rel="manifest" href="manifest.json">
  <title>Orbit ERP</title>
  <script>
    // Use the locally bundled CanvasKit so the PWA shell works fully
    // offline (no gstatic.com dependency at runtime).
    window.flutterConfiguration = { useLocalCanvasKit: true };
  </script>
  <script src="flutter_bootstrap.js" async></script>
  <style>
    html, body { margin: 0; height: 100%; background: #14161c; }
    #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(600px 400px at 50% 30%, rgba(255,140,0,.12), transparent), #14161c; }
    #splash .mark { width: 84px; height: 84px; border-radius: 22px;
      background: linear-gradient(135deg, #ff8c00, #ffb300);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font: 800 44px/1 system-ui, sans-serif;
      box-shadow: 0 16px 40px rgba(255,140,0,.35); }
  </style>
</head>
<body>
  <div id="splash"><div class="mark">O</div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) s.remove();
    });
  </script>
</body>
</html>
